name: CI

on:
  push:
    branches: [master, main, "test/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log

      - name: Upload Jest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log
          retention-days: 7

  auto-fix:
    needs: test
    if: >-
      failure() &&
      (
        (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'fix/auto-heal-')) ||
        (github.event_name == 'push' && startsWith(github.ref_name, 'test/'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout failing revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Download Jest log
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Install dependencies
        run: npm ci

      - name: Ask the agent for a patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_LOG: test-results.log
        run: node --experimental-strip-types scripts/auto-heal.mts

      - name: Open a remediation pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "fix/auto-heal-${RUN_ID}"
          git add -u src
          git commit -m "Fix inverted reservation overlap"
          git push origin "HEAD:fix/auto-heal-${RUN_ID}"
          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "fix/auto-heal-${RUN_ID}" \
            --title "Fix inverted reservation overlap" \
            --body-file pr-body.md
